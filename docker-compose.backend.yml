services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: ppt-automations-backend
    restart: unless-stopped
    env_file:
      - ./Backend/.env
    ports:
      - "8001:8000"
    volumes:
      - ./Backend/secrets:/app/secrets:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
